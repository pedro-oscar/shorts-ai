[workspace]
resolver = "3"
members = ["crates/nucleo", "crates/shorts-cli", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
nucleo = { path = "crates/nucleo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# O tauri-specta ainda é release candidate e pede as versões exatas do specta.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
